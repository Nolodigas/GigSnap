<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>GigSnap v3</title>
<style>
body { font-family: Arial; max-width: 800px; margin: auto; }
input, button { padding: 10px; margin: 5px; }
.event { border: 1px solid #ccc; padding: 10px; margin: 10px 0; }
</style>
</head>
<body>

<h1>GigSnap 🎸 v3.0</h1>

<input id="query" placeholder="Buscar concierto o pegar URL">
<input id="provincia" placeholder="Provincia (opcional)">
<button onclick="searchEvent()">Buscar</button>

<div id="results"></div>

<script>
// ============================
// CONFIG
// ============================
const CORS = "https://api.allorigins.win/raw?url=";

// ============================
// SEARCH
// ============================
async function searchEvent() {
    const q = document.getElementById("query").value;
    const provincia = document.getElementById("provincia").value;

    if (q.startsWith("http")) {
        fetchAndParse(q);
        return;
    }

    const url = `https://duckduckgo.com/html/?q=${encodeURIComponent(q + " concierto España")}`;
    const res = await fetch(CORS + encodeURIComponent(url));
    const html = await res.text();

    const links = [...html.matchAll(/href="(https?:\/\/[^"]+)"/g)]
        .map(m => m[1])
        .filter(l => !l.includes("duckduckgo"));

    for (let link of links.slice(0,5)) {
        const data = await fetchAndParse(link, provincia);
        if (data) break;
    }
}

// ============================
// PARSER PIPELINE
// ============================
async function fetchAndParse(url, provincia="") {
    try {
        const res = await fetch(CORS + encodeURIComponent(url));
        const html = await res.text();

        const doc = new DOMParser().parseFromString(html, "text/html");

        // 1. JSON-LD
        const jsonLd = [...doc.querySelectorAll('script[type="application/ld+json"]')];
        for (let s of jsonLd) {
            try {
                const data = JSON.parse(s.innerText);
                if (data["@type"]?.includes("Event")) {
                    return render(cleanEvent(data, url));
                }
            } catch {}
        }

        // 2. OpenGraph fallback
        const title = doc.querySelector("meta[property='og:title']")?.content;
        if (title) {
            return render({
                name: title,
                url
            });
        }

        return null;

    } catch(e) {
        return null;
    }
}

// ============================
// CLEAN DATA
// ============================
function cleanEvent(data, url) {
    return {
        name: data.name,
        date: data.startDate,
        venue: data.location?.name,
        city: data.location?.address?.addressLocality,
        artists: data.performer?.name || "",
        url
    };
}

// ============================
// RENDER
// ============================
function render(e) {
    const div = document.createElement("div");
    div.className = "event";
    div.innerHTML = `
        <h3>${e.name}</h3>
        <p>${e.date || ""}</p>
        <p>${e.city || ""}</p>
        <a href="${e.url}" target="_blank">Ver evento</a>
    `;
    document.getElementById("results").appendChild(div);

    saveEvent(e);
}

// ============================
// STORAGE
// ============================
function saveEvent(e) {
    const events = JSON.parse(localStorage.getItem("gigsnap_events_v3") || "[]");
    events.push(e);
    localStorage.setItem("gigsnap_events_v3", JSON.stringify(events));
}

// ============================
// AUTO UPDATE
// ============================
setInterval(async () => {
    const events = JSON.parse(localStorage.getItem("gigsnap_events_v3") || "[]");
    for (let e of events) {
        await fetchAndParse(e.url);
    }
}, 900000);

</script>

</body>
</html>
